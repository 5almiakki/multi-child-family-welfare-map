name: Frontend CI

on:
  pull_request:
    branches: [ "main", "develop" ]
    paths:
      - 'frontend/**'

  workflow_dispatch:

jobs:
  build:
    defaults:
      run:
        working-directory: frontend/multi-child-family-welfare-map

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check directory
      run: pwd; ls;

    - name: Create secrets
      run: |
        cat << 'EOF' > .env
        ${{ secrets.FRONTEND_DEV_SECRET }}
        EOF

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: 'npm'
        cache-dependency-path: 'frontend/multi-child-family-welfare-map/package-lock.json'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint --if-present

    - name: Run Tests
      run: npm run test --if-present

    - name: Build Project
      run: npm run build
