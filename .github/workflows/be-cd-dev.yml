name: Backend CD (dev)

on:
  push:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:

  build:
    defaults:
      run:
        working-directory: backend/dagagomap

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build --tag 5almiakki/dagagayo-be:$(date +%s) .

    - name: Push the Docker image
      run: docker image push 5almiakki/dagagayo-be:$(date +%s)
