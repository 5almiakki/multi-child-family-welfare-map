name: Backend CD (dev)

on:
  push:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:

  build:
    defaults:
      run:
        working-directory: backend/dagagomap

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create application-secret.yml
      run: |
        # Make directory if does not exist
        mkdir -p src/main/resources

        cat << 'EOF' > src/main/resources/application-secret.yml
        ${{ secrets.BACKEND_DEV_SECRET }}
        EOF

        ls -al src/main/resources

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build --tag 5almiakki/dagagayo-be:${{ github.sha }} .

    - name: Push the Docker image
      run: docker image push 5almiakki/dagagayo-be:${{ github.sha }}
