name: Backend CD (dev)

on:
  push:
    branches: [ "develop" ]

  workflow_dispatch:

jobs:

  build:
    defaults:
      run:
        working-directory: backend/dagagomap

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create application-secret.yml
      run: |
        # Make directory if does not exist
        mkdir -p src/main/resources

        cat << 'EOF' > src/main/resources/application-secret.yml
        ${{ secrets.BACKEND_DEV_SECRET }}
        EOF

        ls -al src/main/resources

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build --tag 5almiakki/dagagayo-be:${{ github.sha }} .

    - name: Push the Docker image
      run: docker image push 5almiakki/dagagayo-be:${{ github.sha }}

  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
    - name: Start SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan \
          -p ${{ secrets.SSH_PORT }} \
          -H ${{ secrets.SERVER_HOST }} \
          >> ~/.ssh/known_hosts

    - name: Deploy
      run: |
        ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} << 'EOF'
          docker container rm -f dagagayo-dev-be || true
          docker pull 5almiakki/dagagayo-be:${{ github.sha }} &&
          docker run -d \
            --name dagagayo-dev-be \
            --network dagagayo-dev \
            --restart unless-stopped \
            -e "USE_PROFILE=dev,secret" \
            5almiakki/dagagayo-be:${{ github.sha }}
          docker image prune -af
        EOF
