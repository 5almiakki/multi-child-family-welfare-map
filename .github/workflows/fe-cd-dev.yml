name: Frontend CD (dev)

on:
  push:
    branches: [ "develop" ]
    paths:
      - 'frontend/**'

jobs:
  build:
    defaults:
      run:
        working-directory: frontend/multi-child-family-welfare-map

    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Create secrets
      run: |
        cat << 'EOF' > .env
        ${{ secrets.FRONTEND_DEV_SECRET }}
        EOF

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build the Docker image
      run: docker build --tag 5almiakki/dagagayo-fe:${{ github.sha }} .

    - name: Push the Docker image
      run: docker image push 5almiakki/dagagayo-fe:${{ github.sha }}

  deploy:
    needs: build

    runs-on: ubuntu-latest

    steps:
    - name: Start SSH agent
      uses: webfactory/ssh-agent@v0.9.0
      with:
        ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

    - name: Add known_hosts
      run: |
        mkdir -p ~/.ssh
        ssh-keyscan \
          -p ${{ secrets.SSH_PORT }} \
          -H ${{ secrets.SERVER_HOST }} \
          >> ~/.ssh/known_hosts

    - name: Deploy
      run: |
        ssh -p ${{ secrets.SSH_PORT }} ${{ secrets.SERVER_USERNAME }}@${{ secrets.SERVER_HOST }} << 'EOF'
          docker container rm -f dagagayo-dev-fe || true
          docker pull 5almiakki/dagagayo-fe:${{ github.sha }} &&
          docker run -d \
            --name dagagayo-dev-fe \
            --network dagagayo-dev \
            --restart unless-stopped \
            5almiakki/dagagayo-fe:${{ github.sha }}
          docker image prune -af
        EOF
