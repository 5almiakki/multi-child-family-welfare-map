services:
  mysql:
    image: mysql:8.4
    container_name: dagagayo-dev-mysql
    networks:
      - dagagayo-dev

    restart: unless-stopped

    env_file:
      - .env

    volumes:
      - dagagayo-dev-mysql-data:/var/lib/mysql

    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00

volumes:
  dagagayo-dev-mysql-data:
    name: dagagayo-dev-mysql-data

networks:
  dagagayo-dev:
    name: dagagayo-dev
    external: true
