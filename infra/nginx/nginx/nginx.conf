user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log notice;
pid /run/nginx.pid;


events {
    worker_connections 1024;
}


http {
    upstream dev-backend {
        server dagagayo-dev-be:8080;
    }

    server {
        listen 80;
        server_name dagagayo.kro.kr *.dagagayo.kro.kr;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name dagagayo.kro.kr;
        server_tokens off;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        ssl_certificate /etc/letsencrypt/live/dagagayo.kro.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dagagayo.kro.kr/privkey.pem;

        location = /test {
            root /usr/share/nginx/html;
            try_files /index.html =404;
        }
    }

    server {
        listen 443 ssl;
        server_name dev-api.dagagayo.kro.kr;
        server_tokens off;

        ssl_certificate /etc/letsencrypt/live/dagagayo.kro.kr/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/dagagayo.kro.kr/privkey.pem;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            proxy_pass http://dev-backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    sendfile on;
    #tcp_nopush on;

    keepalive_timeout 65;

    #gzip on;

    include /etc/nginx/conf.d/*.conf;
}
